name: Release

on:
  push:
    branches: [dev]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.plan.outputs.publish-plan-artifact-id }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Select Changesets mode
        uses: changesets/action/select-mode@v2
        id: plan

  version:
    if: needs.plan.outputs.mode == 'version'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version-dir-artifact-id: ${{ steps.version.outputs.version-dir-artifact-id }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Version packages
        uses: changesets/action/version@v2
        id: version
        with:
          commit-message: "chore: release @luis.bs/obsidian-attachments-cache"
          pr-title: "chore: release @luis.bs/obsidian-attachments-cache"
#         pr-base-branch: main
          script: pnpm run ci:version

