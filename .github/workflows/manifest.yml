name: Sync Plugin Manifest

on:
  push:
    branches: [changeset-release/main]

jobs:
  sync_manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Plugin Manifest
        run: pnpm run ci:manifest
